[tool:pytest]
# pytest configuration for pyS3M unit tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --strict-markers

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU
    requires_render: marks tests that require render modules

# Minimum version
minversion = 6.0

# Test paths relative to project root
pythonpath = ../src